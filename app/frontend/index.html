<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>サンプル株式会社 就業規則アシスタント</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2b5dd1;
    --accent-weak: #eaf0fc;
    --warn-bg: #fff4e5;
    --warn-border: #f0c98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
      "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  .badge {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: #9a5b00;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .header-note {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
  }
  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .example-btn {
    background: var(--accent-weak);
    border: 1px solid #cdddf7;
    color: var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .example-btn:hover { background: #dde8fb; }
  .msg {
    display: flex;
    margin-bottom: 14px;
  }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.7;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .role-label {
    font-size: 11px;
    color: var(--muted);
    margin: 0 4px 4px;
  }
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
  }
  .input-row {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  button.send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }
  .disclaimer {
    max-width: 820px;
    margin: 10px auto 0;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .pw-row {
    max-width: 820px;
    margin: 0 auto 8px;
    display: none;
    gap: 8px;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
  }
  .pw-row input {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <span class="badge">DEMO / サンプルデータ</span>
    <h1>サンプル株式会社 就業規則アシスタント</h1>
    <span class="header-note" id="headerNote">これはサンプルデータによるデモです</span>
  </header>

  <main>
    <div class="container">
      <div class="examples" id="examples"></div>
      <div id="messages"></div>
    </div>
  </main>

  <footer>
    <div class="pw-row" id="pwRow">
      <label for="pw">パスワード:</label>
      <input type="password" id="pw" placeholder="APP_PASSWORD" />
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="就業規則について質問してください（例: 有給休暇は何日もらえますか？）"></textarea>
      <button class="send" id="sendBtn">送信</button>
    </div>
    <p class="disclaimer">
      ※ 本アシスタントは架空企業「サンプル株式会社」のサンプル規程データに基づくデモです。
      回答は参考情報であり、内容の正確性を保証するものではありません。実際の判断は人事担当者・専門家へご確認ください。
    </p>
  </footer>

<script>
const EXAMPLE_QUESTIONS = [
  "有給休暇は入社後いつから何日もらえますか？",
  "定年は何歳ですか？継続雇用はありますか？",
  "給与の支払日はいつですか？",
  "副業は認められていますか？届出は必要ですか？",
  "テレワーク中の労働時間はどう扱われますか？",
  "ハラスメントの相談窓口について教えてください。",
];

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const examplesEl = document.getElementById("examples");
const pwRow = document.getElementById("pwRow");
const pwEl = document.getElementById("pw");
const headerNote = document.getElementById("headerNote");

// 会話履歴（API 送信用）
const history = [];
let streaming = false;

// 例質問ボタンを生成
EXAMPLE_QUESTIONS.forEach((q) => {
  const btn = document.createElement("button");
  btn.className = "example-btn";
  btn.textContent = q;
  btn.addEventListener("click", () => {
    inputEl.value = q;
    inputEl.focus();
    autoGrow();
  });
  examplesEl.appendChild(btn);
});

// 起動時にヘルス情報を取得し、件数表示とパスワード有無を反映
fetch("/api/health")
  .then((r) => r.json())
  .then((d) => {
    headerNote.textContent =
      `サンプル規程 ${d.document_count} 件（計 ${d.total_characters.toLocaleString()} 文字）／モデル: ${d.model}`;
    if (d.password_protected) {
      pwRow.style.display = "flex";
    }
  })
  .catch(() => {});

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}
inputEl.addEventListener("input", autoGrow);

function addMessage(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const inner = document.createElement("div");
  const label = document.createElement("div");
  label.className = "role-label";
  label.textContent = role === "user" ? "あなた" : "アシスタント";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  inner.appendChild(label);
  inner.appendChild(bubble);
  wrap.appendChild(inner);
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

function scrollToBottom() {
  const main = document.querySelector("main");
  main.scrollTop = main.scrollHeight;
}

async function send() {
  if (streaming) return;
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage("user", text);
  history.push({ role: "user", content: text });
  inputEl.value = "";
  autoGrow();

  const bubble = addMessage("assistant", "");
  bubble.textContent = "…";

  streaming = true;
  sendBtn.disabled = true;

  try {
    const headers = { "Content-Type": "application/json" };
    if (pwEl.value) headers["X-App-Password"] = pwEl.value;

    const res = await fetch("/api/chat", {
      method: "POST",
      headers,
      body: JSON.stringify({ messages: history }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      bubble.textContent = "エラー: " + (err.detail || res.statusText);
      streaming = false;
      sendBtn.disabled = false;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let answer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // SSE は \n\n 区切り
      const chunks = buffer.split("\n\n");
      buffer = chunks.pop();
      for (const chunk of chunks) {
        const line = chunk.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        let obj;
        try { obj = JSON.parse(payload); } catch { continue; }
        if (obj.error) {
          answer += "\n[エラー] " + obj.error;
          bubble.textContent = answer;
        } else if (obj.text) {
          answer += obj.text;
          bubble.textContent = answer;
          scrollToBottom();
        }
      }
    }

    if (!answer) bubble.textContent = "(応答がありませんでした)";
    history.push({ role: "assistant", content: answer });
  } catch (e) {
    bubble.textContent = "通信エラー: " + e.message;
  } finally {
    streaming = false;
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", send);

// IME 変換確定の Enter で誤送信しないよう isComposing を判定する
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    if (e.isComposing || e.keyCode === 229) {
      // 変換確定中の Enter。送信しない。
      return;
    }
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
